<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Facturas</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #0d6efd; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    button { background-color: #0d6efd; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; }
    button:hover { background-color: #0b5ed7; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>Registro de Factura</h2>

  <form id="facturaForm">
    <div class="form-group">
      <label for="tipoOperacion">Tipo de Operación</label>
      <select id="tipoOperacion" required>
        <option value="Ventas">Venta</option>
        <option value="Compras">Compra</option>
      </select>
    </div>

    <div class="form-group">
      <label for="fechaFactura">Fecha de Factura</label>
      <input type="date" id="fechaFactura" required>
    </div>

    <div class="form-group">
      <label for="numFactura">Número de Factura</label>
      <input type="text" id="numFactura" placeholder="Ej: 105" required>
    </div>

    <div class="form-group">
      <label for="numControl">Número de Control</label>
      <input type="text" id="numControl" placeholder="Ej: 00-00045">
    </div>

    <div class="form-group">
      <label for="rif">RIF Tercero</label>
      <input type="text" id="rif" placeholder="Ej: J-501234567" required>
    </div>

    <div class="form-group">
      <label for="montoExento">Monto Exento (BS)</label>
      <input type="number" step="0.01" id="montoExento" placeholder="0.00">
    </div>

    <div class="form-group">
      <label for="baseImponible">Base Imponible (BS)</label>
      <input type="number" step="0.01" id="baseImponible" placeholder="0.00" required>
    </div>

    <div class="form-group">
      <label for="porcRetencion">% Retención IVA</label>
      <select id="porcRetencion">
        <option value="0.75">75%</option>
        <option value="1.00">100%</option>
        <option value="0.00">0% (Sin Retención)</option>
      </select>
    </div>

    <button type="submit" id="btnGuardar">Guardar en Google Sheets</button>
  </form>

  <div id="mensajeEstado" class="status"></div>
</div>

<script>
  // DOCUMENTACIÓN: URL de la aplicación web activa en Google Apps Script
  const URL_BASE = "https://script.google.com/macros/s/AKfycby4soLziaVKlfIOqBgSritHJWzReYzf6AhpijUP_b8Hz1ZHOlwhbZ-OE1lNwgeLJVYLkA/exec";

  document.getElementById("facturaForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const estado = document.getElementById("mensajeEstado");
    const btn = document.getElementById("btnGuardar");
    
    btn.disabled = true;
    estado.style.color = "#0d6efd";
    estado.textContent = "Enviando datos a Google Sheets...";

    const datosFactura = {
      tipoOperacion: document.getElementById("tipoOperacion").value,
      fechaFactura: document.getElementById("fechaFactura").value,
      numeroFactura: document.getElementById("numFactura").value,
      numeroControl: document.getElementById("numControl").value,
      rifTercero: document.getElementById("rif").value,
      montoExento: parseFloat(document.getElementById("montoExento").value) || 0,
      baseImponible: parseFloat(document.getElementById("baseImponible").value) || 0,
      porcRetencion: parseFloat(document.getElementById("porcRetencion").value) || 0
    };

    // DOCUMENTACIÓN:
    // Se añade un parámetro 't' con la hora actual para evitar el uso de caché en navegadores móviles
    const urlConAntiCache = URL_BASE + "?t=" + new Date().getTime();

    // DOCUMENTACIÓN: Petición HTTP optimizada para compatibilidad móvil
    fetch(urlConAntiCache, {
      method: "POST",
      mode: "no-cors",
      redirect: "follow",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(datosFactura)
    })
    .then(() => {
      estado.style.color = "green";
      estado.textContent = "¡Factura enviada con éxito!";
      document.getElementById("facturaForm").reset();
      btn.disabled = false;
    })
    .catch(err => {
      console.error("Error de envío:", err);
      estado.style.color = "red";
      estado.textContent = "Error de conexión. Intenta nuevamente.";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
