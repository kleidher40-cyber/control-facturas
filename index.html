<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- DOCUMENTACIÓN: viewport asegura que la página se adapte al tamaño de pantalla del teléfono -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Facturas</title>
  
  <!-- DOCUMENTACIÓN: Carga de la librería Tesseract.js para escaneo OCR desde imágenes -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    /* ESTILOS BASE PARA DISPOSITIVOS MÓVILES */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 15px;
      color: #333;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      background-color: #0d6efd;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0b5ed7;
    }
    .status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Registro de Factura</h2>

  <form id="facturaForm">
    <div class="form-group">
      <label for="tipoOperacion">Tipo de Operación</label>
      <select id="tipoOperacion" required>
        <option value="Compras">Compra</option>
        <option value="Ventas">Venta</option>
      </select>
    </div>

    <div class="form-group">
      <label for="fechaFactura">Fecha de Factura</label>
      <input type="date" id="fechaFactura" required>
    </div>

    <div class="form-group">
      <label for="numFactura">Número de Factura</label>
      <input type="text" id="numFactura" placeholder="Ej: 000105" required>
    </div>

    <div class="form-group">
      <label for="numControl">Número de Control</label>
      <input type="text" id="numControl" placeholder="Ej: 00-00045">
    </div>

    <div class="form-group">
      <label for="rif">RIF Tercero</label>
      <input type="text" id="rif" placeholder="Ej: J-501234567" required>
    </div>

    <div class="form-group">
      <label for="baseImponible">Base Imponible (BS)</label>
      <input type="number" step="0.01" id="baseImponible" placeholder="0.00" required>
    </div>

    <button type="submit" id="btnGuardar">Guardar en Google Sheets</button>
  </form>

  <div id="mensajeEstado" class="status"></div>
</div>

<script>
  // DOCUMENTACIÓN:
  // URL generada por Google Apps Script para conectar la web con tu Google Sheet.
  const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbwRmKleI fbeZZRkfMYbbNFaYJbf5KWY5mhpPnr5f_p7Fjtw0XBuZbYm_KGerKCKzNvXfg/exec";

  // Captura del evento de envío del formulario
  document.getElementById("facturaForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const estado = document.getElementById("mensajeEstado");
    const btn = document.getElementById("btnGuardar");
    
    btn.disabled = true;
    estado.style.color = "#0d6efd";
    estado.textContent = "Guardando registro...";

    // Recopilación de datos desde los campos del formulario
    const base = parseFloat(document.getElementById("baseImponible").value) || 0;
    const alicuota = 0.16;
    const montoIVA = base * alicuota;
    const montoTotal = base + montoIVA;
    const retencionPct = 0.75;
    const montoRetenido = montoIVA * retencionPct;

    const datosFactura = {
      tipoOperacion: document.getElementById("tipoOperacion").value,
      fechaFactura: document.getElementById("fechaFactura").value,
      numFactura: document.getElementById("numFactura").value,
      numControl: document.getElementById("numControl").value,
      rif: document.getElementById("rif").value,
      montoExento: 0,
      baseImponible: base,
      alicuotaIVA: "16%",
      montoIVA: montoIVA,
      montoTotal: montoTotal,
      porcentajeRetencion: "75%",
      montoRetenido: montoRetenido
    };

    // Envío de datos mediante petición HTTP POST a Apps Script
    fetch(URL_SCRIPT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(datosFactura)
    })
    .then(() => {
      estado.style.color = "green";
      estado.textContent = "¡Factura guardada con éxito!";
      document.getElementById("facturaForm").reset();
      btn.disabled = false;
    })
    .catch(err => {
      console.error("Error:", err);
      estado.style.color = "red";
      estado.textContent = "Error al guardar. Intenta nuevamente.";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
