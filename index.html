<script>
  // DOCUMENTACIÓN:
  // URL actualizada correspondiente a la Versión 8 de Google Apps Script
  const URL_SCRIPT = "https://script.google.com/macros/s/AKfycby4soLziaVKlfIOqBgSritHJWzReYzf6AhpijUP_b8Hz1ZHOlwhbZ-OE1lNwgeLJVYLkA/exec";

  // DOCUMENTACIÓN:
  // Escuchador del formulario que captura el clic en el botón de envío
  document.getElementById("facturaForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const estado = document.getElementById("mensajeEstado");
    const btn = document.getElementById("btnGuardar");
    
    // Deshabilitar botón durante el envío para evitar duplicados
    btn.disabled = true;
    estado.style.color = "#0d6efd";
    estado.textContent = "Enviando datos a Google Sheets...";

    const base = parseFloat(document.getElementById("baseImponible").value) || 0;

    // Objeto estructurado con los datos de la factura
    const datosFactura = {
      tipoOperacion: document.getElementById("tipoOperacion").value,
      fechaFactura: document.getElementById("fechaFactura").value,
      numeroFactura: document.getElementById("numFactura").value,
      numeroControl: document.getElementById("numControl").value,
      rifTercero: document.getElementById("rif").value,
      baseImponible: base
    };

    // DOCUMENTACIÓN:
    // Petición HTTP POST enviada como texto plano para evitar bloqueos CORS
    fetch(URL_SCRIPT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(datosFactura)
    })
    .then(() => {
      estado.style.color = "green";
      estado.textContent = "¡Factura enviada con éxito!";
      document.getElementById("facturaForm").reset();
      btn.disabled = false;
    })
    .catch(err => {
      console.error("Error de envío:", err);
      estado.style.color = "red";
      estado.textContent = "Error de conexión. Intenta nuevamente.";
      btn.disabled = false;
    });
  });
</script>
